name: REVO news

# One poll, all day. The schedule carries no meaning any more: decide_phase.py
# looks at whether today's review has been written and picks the job from that.
#
# The previous design keyed the phase off which cron string fired, which broke
# twice — once when the review time changed and the string it was compared
# against did not, and again when GitHub skipped the single daily cron and the
# day passed with no candidates at all. A missed slot is now picked up on the
# next poll instead of being lost.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      phase:
        description: "review or publish (空欄なら自動判定)"
        required: false
        default: ""
        type: choice
        options: ["", review, publish]

concurrency:
  group: revo-news
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
  DISCORD_BOT_USER_ID: ${{ secrets.DISCORD_BOT_USER_ID }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide phase
        id: phase
        working-directory: newsfeed
        run: |
          if [ -n "${{ inputs.phase }}" ]; then
            echo "name=${{ inputs.phase }}" >> "$GITHUB_OUTPUT"
            echo "phase=${{ inputs.phase }} (手動指定)"
          else
            python decide_phase.py
          fi

      # Cheap check on the publish path: this runs ~288 times a day, so nothing
      # heavier than `requests` belongs here.
      - name: Check for picks
        id: check
        if: steps.phase.outputs.name == 'publish'
        working-directory: newsfeed
        run: |
          pip install --quiet requests
          python check_picks.py

      - name: Cache Playwright browsers
        if: steps.phase.outputs.name == 'review' || steps.check.outputs.has_picks == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      - name: Install
        if: steps.phase.outputs.name == 'review' || steps.check.outputs.has_picks == 'true'
        run: |
          pip install --quiet -r requirements.txt
          playwright install --with-deps chromium

      - name: Review
        if: steps.phase.outputs.name == 'review'
        working-directory: newsfeed
        run: python run_review.py --live

      - name: Publish
        if: steps.phase.outputs.name == 'publish' && steps.check.outputs.has_picks == 'true'
        working-directory: newsfeed
        run: python run_publish.py

      # seen.json and review-*.json must survive between runs — and the review
      # file is now what stops the day's review from running twice, so losing it
      # would mean re-posting the candidate list every five minutes.
      - name: Persist state
        if: steps.phase.outputs.name == 'review' || steps.check.outputs.has_picks == 'true'
        run: |
          git config user.name  "revo-news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add newsfeed/state
          git diff --cached --quiet || git commit -m "state: ${{ steps.phase.outputs.name }} $(date +%FT%H:%M)"
          git pull --rebase --autostash
          git push

      - name: Notify failure
        if: failure()
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"⚠️ REVO news 失敗 (${{ steps.phase.outputs.name }})\\nhttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
