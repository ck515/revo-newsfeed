name: REVO news

# Two runs a day, no always-on process. The gap between them is the human's
# window to react; nothing publishes if nobody does.
on:
  schedule:
    - cron: "0 10 * * *"   # 19:00 JST — post the day's candidate list
    - cron: "30 12 * * *"  # 21:30 JST — read reactions, deliver the picks
  workflow_dispatch:
    inputs:
      phase:
        description: "review or publish"
        required: true
        default: review
        type: choice
        options: [review, publish]

concurrency:
  group: revo-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to commit state/ back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install feedparser anthropic requests playwright budoux
          playwright install --with-deps chromium

      - name: Decide phase
        id: phase
        run: |
          if [ -n "${{ inputs.phase }}" ]; then
            echo "name=${{ inputs.phase }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 10 * * *" ]; then
            echo "name=review" >> "$GITHUB_OUTPUT"
          else
            echo "name=publish" >> "$GITHUB_OUTPUT"
          fi

      - name: Review
        if: steps.phase.outputs.name == 'review'
        working-directory: newsfeed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_BOT_USER_ID: ${{ secrets.DISCORD_BOT_USER_ID }}
        run: python run_review.py --live --strict

      - name: Publish
        if: steps.phase.outputs.name == 'publish'
        working-directory: newsfeed
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_BOT_USER_ID: ${{ secrets.DISCORD_BOT_USER_ID }}
        run: python run_publish.py

      # seen.json and review-*.json have to survive between the two runs and
      # between days, otherwise every article looks new every morning.
      - name: Persist state
        run: |
          git config user.name  "revo-news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add newsfeed/state
          git diff --cached --quiet || git commit -m "state: ${{ steps.phase.outputs.name }} $(date -u +%F)"
          git pull --rebase --autostash
          git push
