name: REVO news

# Two phases. Review runs once a day; publish polls often but bails out in
# seconds unless somebody has actually reacted, so the expensive Playwright
# install only happens on runs that have work to do.
on:
  schedule:
    - cron: "0 10 * * *"        # 19:00 JST — post the day's candidate list
    # Polls all day: the point is to pick up a reaction whenever it happens,
    # and a run with nothing to do costs a few seconds.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      phase:
        description: "review or publish"
        required: true
        default: publish
        type: choice
        options: [review, publish]

concurrency:
  group: revo-news
  cancel-in-progress: false

env:
  # The runner clock is UTC. Without this, a run after midnight JST reads as
  # the previous day and looks for a review file that was never written.
  TZ: Asia/Tokyo
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
  DISCORD_BOT_USER_ID: ${{ secrets.DISCORD_BOT_USER_ID }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide phase
        id: phase
        run: |
          if [ -n "${{ inputs.phase }}" ]; then
            echo "name=${{ inputs.phase }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 10 * * *" ]; then
            echo "name=review" >> "$GITHUB_OUTPUT"
          else
            echo "name=publish" >> "$GITHUB_OUTPUT"
          fi

      # ---- publish: cheap check first -----------------------------------
      # Only `requests` is needed to ask Discord who reacted. This is the step
      # that runs ~60 times a day, so nothing heavier belongs here.
      - name: Check for picks
        id: check
        if: steps.phase.outputs.name == 'publish'
        working-directory: newsfeed
        run: |
          pip install --quiet requests
          python check_picks.py

      # ---- heavy install, only when needed ------------------------------
      - name: Cache Playwright browsers
        if: steps.phase.outputs.name == 'review' || steps.check.outputs.has_picks == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      - name: Install
        if: steps.phase.outputs.name == 'review' || steps.check.outputs.has_picks == 'true'
        run: |
          pip install --quiet feedparser anthropic requests playwright budoux
          playwright install --with-deps chromium

      - name: Review
        if: steps.phase.outputs.name == 'review'
        working-directory: newsfeed
        run: python run_review.py --live --strict

      - name: Publish
        if: steps.phase.outputs.name == 'publish' && steps.check.outputs.has_picks == 'true'
        working-directory: newsfeed
        run: python run_publish.py

      # seen.json and review-*.json must survive between runs, otherwise every
      # article looks new every morning and picks are forgotten.
      - name: Persist state
        if: steps.phase.outputs.name == 'review' || steps.check.outputs.has_picks == 'true'
        run: |
          git config user.name  "revo-news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add newsfeed/state
          git diff --cached --quiet || git commit -m "state: ${{ steps.phase.outputs.name }} $(date -u +%FT%H:%M)"
          git pull --rebase --autostash
          git push
