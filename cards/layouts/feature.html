<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>__BASE_CSS__
/* FEATURE / 機能紹介
   Concept: the parts catalogue callout. Aftermarket catalogues name the part in
   Latin, translate it underneath, then number the things it does — ①②③ against
   a diagram. That structure is already familiar to anyone who has ordered
   parts, and it forces the copy into three concrete claims instead of a
   paragraph of feature marketing. */

/* The English name was the largest element on the card in solid accent, but
   the reader reads the Japanese. Demoting it to a label and promoting the
   Japanese name is most of what made this look cheap. */
.name-en {
  font-family:'SairaCond',sans-serif; font-weight:600; font-size:34px; line-height:1;
  letter-spacing:0.24em; color:var(--fg-low); transform:none;
  margin-bottom:26px;
}
.name-ja {
  font-family:'NotoJP',sans-serif; font-weight:900; font-size:74px; line-height:1.3;
  letter-spacing:-0.01em; color:var(--fg); font-feature-settings:"palt" 1;
}
.lead {
  font-family:'NotoJP',sans-serif; font-weight:500; font-size:31px; line-height:1.66;
  color:var(--fg-mid); margin-top:22px; font-feature-settings:"palt" 1;
}
.rule-sm { margin:52px 0 8px; width:100%; height:1px; background:var(--border); }

.points { display:flex; flex-direction:column; flex:1 1 auto; min-height:0; justify-content:space-evenly; margin-top:12px; }
.pt { display:flex; align-items:flex-start; gap:26px; padding:22px 0; }
.pt .n {
  flex:0 0 30px; height:30px;
  color:var(--accent);
  font-family:'SairaCond',sans-serif; font-weight:900; font-size:26px;
  display:flex; align-items:flex-start; justify-content:flex-start;
  padding-top:8px;
}
.pt .tx {
  font-family:'NotoJP',sans-serif; font-weight:700; font-size:34px; line-height:1.5;
  color:var(--fg); padding-top:6px; font-feature-settings:"palt" 1;
}
</style>
</head>
<body class="__BODY_CLASS__">
  <div class="card" id="card">
    <div class="tag" id="tag"><span>FEATURE</span></div>
    <div class="stripe" id="stripe"><i></i><i></i><i></i></div>

    <div class="body-area" id="bodybox">
      <div class="name-en">__NAME_EN__</div>
      <div class="name-ja">__NAME_JA__</div>
      <div class="lead">__LEAD__</div>
      <div class="rule-sm"></div>
      <div class="points" id="fit">__POINTS__</div>
    </div>

    <div class="footer">
      <div class="hair"></div>
      <div class="footer-row">
        <div class="mark">__MARK__</div>
        <div class="date">__DATE__</div>
      </div>
    </div>
  </div>
<script>
document.fonts.ready.then(function () {
  var tag = document.getElementById('tag'), stripe = document.getElementById('stripe');
  stripe.style.left = (tag.offsetLeft + tag.offsetWidth + 18) + 'px';
  var box = document.getElementById('bodybox');
  var en = document.querySelector('.name-en'), ja = document.querySelector('.name-ja');
  var SETS = [[34,74,34],[34,66,31],[34,58,28],[34,52,25],[34,46,22]];
  for (var i = 0; i < SETS.length; i++) {
    en.style.fontSize = SETS[i][0] + 'px';
    ja.style.fontSize = SETS[i][1] + 'px';
    document.querySelectorAll('.pt .tx').forEach(function (e) {
      e.style.fontSize = SETS[i][2] + 'px';
    });
    var pts = document.querySelector('.points'), used = 0;
    [].forEach.call(pts.children, function (r) { used += r.offsetHeight; });
    if (box.scrollHeight <= box.clientHeight + 1 && used <= pts.clientHeight + 1) break;
  }
  document.body.dataset.ready = '1';
});
</script>
</body>
</html>
