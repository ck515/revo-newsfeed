<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><style>__BASE_CSS__
/* LINEUP — 実装予定の機能一覧
   Concept: the spec sheet. A numbered column of names with one line of
   explanation each, the way an accessory catalogue lists what is in the box.
   Names carry the weight; explanations stay quiet, so the card can be read in
   two passes — scan the names, then read what interests you. */

.head { margin-bottom:14px; }
.head .num { font-size:96px; line-height:0.9; color:var(--fg); letter-spacing:0.02em; }
.head .lab {
  font-family:'NotoJP',sans-serif; font-weight:500; font-size:30px;
  color:var(--fg-low); letter-spacing:0.04em; margin-left:22px;
}
.when {
  font-family:'NotoJP',sans-serif; font-weight:500; font-size:27px;
  color:var(--fg-low); margin:6px 0 40px; letter-spacing:0.04em;
}

.list { display:flex; flex-direction:column; flex:1 1 auto; min-height:0; justify-content:space-evenly; }
.item { display:flex; align-items:flex-start; gap:26px; padding:20px 0; border-top:1px solid var(--border); }
.item:last-child { border-bottom:1px solid var(--border); }
.item .n {
  flex:0 0 44px; padding-top:9px;
  font-family:'SairaCond',sans-serif; font-weight:900; font-size:24px;
  color:var(--fg-low); letter-spacing:0.04em;
}
.item .body { min-width:0; }
.item .nm {
  font-family:'NotoJP',sans-serif; font-weight:900; font-size:42px; line-height:1.3;
  color:var(--fg); font-feature-settings:"palt" 1; letter-spacing:-0.01em;
}
.item .ds {
  font-family:'NotoJP',sans-serif; font-weight:400; font-size:27px; line-height:1.6;
  color:var(--fg-mid); margin-top:8px; font-feature-settings:"palt" 1;
}
</style></head>
<body class="__BODY_CLASS__">
  <div class="card" id="card">
    <div class="tag" id="tag"><span>__TAG__</span></div>
    <div class="stripe" id="stripe"></div>
    <div class="body-area" id="bodybox">
      <div class="head"><span class="num en">__PERIOD__</span><span class="lab">__PERIOD_LABEL__</span></div>
      <div class="when">__WHEN__</div>
      <div class="list" id="fit">__ITEMS__</div>
    </div>
    <div class="footer"><div class="hair"></div>
      <div class="footer-row"><div class="mark">__MARK__</div><div class="date">__DATE__</div></div>
    </div>
  </div>
<script>
document.fonts.ready.then(function () {
  var box = document.getElementById('bodybox');
  function fits() {
    var list = document.querySelector('.list'), used = 0;
    [].forEach.call(list.children, function (r) { used += r.offsetHeight; });
    return used <= list.clientHeight + 1;
  }
  // Name and description shrink together so the two levels stay distinct.
  var SETS = [[42,27],[38,25],[35,23],[32,21],[29,19],[26,18]];
  for (var i = 0; i < SETS.length; i++) {
    document.querySelectorAll('.nm').forEach(function (e) { e.style.fontSize = SETS[i][0] + 'px'; });
    document.querySelectorAll('.ds').forEach(function (e) { e.style.fontSize = SETS[i][1] + 'px'; });
    if (fits()) break;
  }
  document.body.dataset.ready = '1';
});
</script></body></html>
